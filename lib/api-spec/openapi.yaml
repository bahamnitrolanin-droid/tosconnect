openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TosConnect API — professional audio services platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Mixing & mastering orders
  - name: bookings
    description: Consultation bookings
  - name: admin
    description: Admin management endpoints
  - name: payway
    description: ABA PayWay KHQR payment endpoints
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: stats
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new mixing & mastering order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /orders/{id}/track:
    post:
      operationId: trackOrder
      tags: [orders]
      summary: Track an order by ID and email (customer self-service)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderTrackInput"
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatus"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new consultation booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login with passphrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResult"
        "401":
          description: Wrong passphrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: List all orders (admin)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, paid, in_progress, delivered, cancelled]
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrdersResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/orders/{id}:
    get:
      operationId: adminGetOrder
      tags: [admin]
      summary: Get a single order (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: adminUpdateOrder
      tags: [admin]
      summary: Update an order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/bookings:
    get:
      operationId: adminListBookings
      tags: [admin]
      summary: List all bookings (admin)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, paid, confirmed, completed, cancelled]
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookingsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/bookings/{id}:
    get:
      operationId: adminGetBooking
      tags: [admin]
      summary: Get a single booking (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: adminUpdateBooking
      tags: [admin]
      summary: Update a booking (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin, stats]
      summary: Get dashboard statistics (admin)
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /payway/create-transaction:
    post:
      operationId: createTransaction
      tags: [payway]
      summary: Create a KHQR payment transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionInput"
      responses:
        "201":
          description: Transaction created, QR code ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order or booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Already paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /payway/transaction-status/{transactionId}:
    get:
      operationId: getTransactionStatus
      tags: [payway]
      summary: Poll transaction payment status
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatus"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /payway/callback:
    post:
      operationId: handlePaywayCallback
      tags: [payway]
      summary: ABA PayWay webhook callback receiver (verified internally via HMAC)
      responses:
        "200":
          description: Callback received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackAck"

  /payway/retry/{transactionId}:
    post:
      operationId: retryTransaction
      tags: [payway]
      summary: Generate a fresh KHQR for an expired or failed transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: New transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreated"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Cannot retry — transaction is not expired/failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Order:
      type: object
      required: [id, customerName, email, serviceType, details, status, amountUsd, amountKhr, createdAt]
      properties:
        id:
          type: string
        customerName:
          type: string
        email:
          type: string
        serviceType:
          type: string
          enum: [mixing_mastering]
        details:
          type: string
        stemsUrls:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, paid, in_progress, delivered, cancelled]
        amountUsd:
          type: number
        amountKhr:
          type: number
        paymentRef:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderInput:
      type: object
      required: [customerName, email, details, amountUsd, amountKhr]
      properties:
        customerName:
          type: string
          minLength: 1
        email:
          type: string
        details:
          type: string
          minLength: 1
        stemsUrls:
          type: array
          items:
            type: string
        amountUsd:
          type: number
        amountKhr:
          type: number

    OrderTrackInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    OrderUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, paid, in_progress, delivered, cancelled]
        notes:
          type: string
        paymentRef:
          type: string

    OrderStatus:
      type: object
      required: [id, status, serviceType, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, paid, in_progress, delivered, cancelled]
        serviceType:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        notes:
          type: ["string", "null"]

    Booking:
      type: object
      required: [id, customerName, email, sessionTopic, status, amountUsd, amountKhr, createdAt]
      properties:
        id:
          type: string
        customerName:
          type: string
        email:
          type: string
        sessionTopic:
          type: string
        preferredTimes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, paid, confirmed, completed, cancelled]
        zoomLink:
          type: ["string", "null"]
        amountUsd:
          type: number
        amountKhr:
          type: number
        paymentRef:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookingInput:
      type: object
      required: [customerName, email, sessionTopic, amountUsd, amountKhr]
      properties:
        customerName:
          type: string
          minLength: 1
        email:
          type: string
        sessionTopic:
          type: string
          minLength: 1
        preferredTimes:
          type: array
          items:
            type: string
        amountUsd:
          type: number
        amountKhr:
          type: number

    BookingUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, paid, confirmed, completed, cancelled]
        zoomLink:
          type: string
        notes:
          type: string
        paymentRef:
          type: string

    AdminOrdersResponse:
      type: object
      required: [orders, total, page, limit]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    AdminBookingsResponse:
      type: object
      required: [bookings, total, page, limit]
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    DashboardStats:
      type: object
      required: [totalOrders, totalBookings, pendingOrders, pendingBookings, inProgressOrders, paidOrdersTotal, paidBookingsTotal, recentOrders, recentBookings]
      properties:
        totalOrders:
          type: number
        totalBookings:
          type: number
        pendingOrders:
          type: number
        pendingBookings:
          type: number
        inProgressOrders:
          type: number
        paidOrdersTotal:
          type: number
        paidBookingsTotal:
          type: number
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        recentBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"

    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminAuthResult:
      type: object
      required: [token]
      properties:
        token:
          type: string

    CreateTransactionInput:
      type: object
      properties:
        orderId:
          type: string
        bookingId:
          type: string

    TransactionCreated:
      type: object
      required: [transactionId, qrImage, expiresAt, amountUsd, amountKhr]
      properties:
        transactionId:
          type: string
        qrImage:
          type: string
          description: Base64 data URL of the KHQR QR code image
        expiresAt:
          type: string
          format: date-time
        amountUsd:
          type: number
        amountKhr:
          type: number

    TransactionStatus:
      type: object
      required: [transactionId, status, expiresAt]
      properties:
        transactionId:
          type: string
        status:
          type: string
          enum: [pending, paid, expired, failed]
        orderId:
          type: string
        bookingId:
          type: string
        expiresAt:
          type: string
          format: date-time

    CallbackAck:
      type: object
      required: [received]
      properties:
        received:
          type: boolean

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: number
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. audio/wav).

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. /objects/uploads/uuid). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
